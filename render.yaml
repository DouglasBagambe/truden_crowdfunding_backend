databases:
  - name: keibo-staging-ledger
    databaseName: keibo_staging_ledger
    user: keibo_staging_ledger_user
    plan: free
    region: oregon
    postgresMajorVersion: 16


services:
  - type: keyvalue
    name: keibo-staging-queue
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []


  - type: web
    name: keibo-staging-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run financial:migrate && npm run start:prod
    healthCheckPath: /api/financial/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: FINANCIAL_DATABASE_URL
        fromDatabase:
          name: keibo-staging-ledger
