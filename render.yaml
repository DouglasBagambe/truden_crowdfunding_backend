databases:
  - name: keibo-staging-ledger
    databaseName: keibo_staging_ledger
    user: keibo_staging_ledger_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: keyvalue
    name: keibo-staging-queue
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: keibo-staging-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run financial:migrate && npm run start:prod
    healthCheckPath: /api/financial/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: FINANCIAL_DATABASE_URL
        fromDatabase:
          name: keibo-staging-ledger
          property: 'connectionString'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: keibo-staging-queue
          property: 'connectionString'
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: keibo-staging
      - key: JWT_AUDIENCE
        value: keibo-staging
      - key: FRONTEND_URL
        value: https://keibo-staging-web.onrender.com
      - key: BACKEND_URL
        value: https://keibo-staging-api.onrender.com
      - key: CORS_ORIGIN
        value: https://keibo-staging-web.onrender.com
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SIWE_DOMAIN
        value: keibo-staging-web.onrender.com
      - key: SIWE_URI
        value: https://keibo-staging-web.onrender.com
      - key: SIWE_CHAIN_IDS
        value: '11155111'
      - key: AUTH_EMAIL_BYPASS
        value: 'false'
      - key: KYC_BYPASS
        value: 'false'
      - key: INVESTMENTS_TEST_MODE
        value: 'false'
      - key: BLOCKCHAIN_FEATURES_ENABLED
        value: 'false'
      - key: ENABLE_NFT_MARKETPLACE
        value: 'false'
      - key: ROI_DISABLE_NFT_MINTING
        value: 'true'
      - key: KYC_PROVIDER
        value: didit
      - key: KYC_PROVIDER_MODE
        value: live
      - key: DIDIT_SANDBOX
        value: 'false'
      - key: PLATFORM_SIGNER_PROVIDER
        value: disabled
      - key: FINANCIAL_WORKERS_ENABLED
        value: 'false'

  - type: worker
    name: keibo-staging-financial-worker
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run financial:migrate && npm run start:worker
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: FINANCIAL_DATABASE_URL
        fromDatabase:
          name: keibo-staging-ledger
          property: 'connectionString'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: keibo-staging-queue
          property: 'connectionString'
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: keibo-staging
      - key: JWT_AUDIENCE
        value: keibo-staging
      - key: FRONTEND_URL
        value: https://keibo-staging-web.onrender.com
      - key: BACKEND_URL
        value: https://keibo-staging-api.onrender.com
      - key: CORS_ORIGIN
        value: https://keibo-staging-web.onrender.com
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SIWE_DOMAIN
        value: keibo-staging-web.onrender.com
      - key: SIWE_URI
        value: https://keibo-staging-web.onrender.com
      - key: SIWE_CHAIN_IDS
        value: '11155111'
      - key: AUTH_EMAIL_BYPASS
        value: 'false'
      - key: KYC_BYPASS
        value: 'false'
      - key: INVESTMENTS_TEST_MODE
        value: 'false'
      - key: BLOCKCHAIN_FEATURES_ENABLED
        value: 'false'
      - key: ENABLE_NFT_MARKETPLACE
        value: 'false'
      - key: ROI_DISABLE_NFT_MINTING
        value: 'true'
      - key: KYC_PROVIDER
        value: didit
      - key: KYC_PROVIDER_MODE
        value: live
      - key: DIDIT_SANDBOX
        value: 'false'
      - key: PLATFORM_SIGNER_PROVIDER
        value: disabled
      - key: FINANCIAL_WORKERS_ENABLED
        value: 'true'
