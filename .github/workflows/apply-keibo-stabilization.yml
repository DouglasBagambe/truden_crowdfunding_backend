name: Apply KEIBO backend stabilization
on:
  push:
    branches: ["keibo/full-uat"]
    paths: [".github/workflows/apply-keibo-stabilization.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keibo/full-uat
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set +e
          cat .keibo-stabilization/backend.part0 .keibo-stabilization/backend.part1 .keibo-stabilization/backend.part2 | base64 -d | xz -dc >/tmp/keibo-backend.diff
          echo "decoded bytes=$(wc -c </tmp/keibo-backend.diff)"
          git apply --reject --whitespace=fix /tmp/keibo-backend.diff
          rc=$?
          echo "git apply rc=$rc"
          find . -name '*.rej' -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \;
          find . -name '*.rej' -delete
          rm -rf .keibo-stabilization .github/workflows/apply-keibo-stabilization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply KEIBO backend stabilization"
            git push origin HEAD:keibo/full-uat
          fi
          exit 0
