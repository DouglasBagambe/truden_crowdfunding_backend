name: Reconcile KEIBO backend conflicts
on:
  push:
    branches: ["keibo/full-uat"]
    paths: [".github/workflows/reconcile-keibo-stabilization.yml"]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: keibo/full-uat
          fetch-depth: 0
      - name: Reconcile rejected hunks
        shell: bash
        run: |
          set -euo pipefail
          cat .keibo-stabilization/backend.part0 .keibo-stabilization/backend.part1 .keibo-stabilization/backend.part2 | base64 -d | xz -dc >/tmp/keibo-backend.diff
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('/tmp/keibo-backend.diff').read_text()
          lines = patch.splitlines()

          def file_hunks(path):
              start = next(i for i,l in enumerate(lines) if l == f'diff --git a/{path} b/{path}')
              end = next((i for i in range(start+1,len(lines)) if lines[i].startswith('diff --git ')), len(lines))
              block = lines[start:end]
              hunks=[]
              i=0
              while i < len(block):
                  if block[i].startswith('@@ '):
                      h=[]
                      i+=1
                      while i < len(block) and not block[i].startswith('@@ '):
                          if block[i].startswith('diff --git '): break
                          if block[i][:1] in (' ','+','-'):
                              h.append(block[i])
                          i+=1
                      hunks.append(h)
                  else:
                      i+=1
              return hunks

          # Service: replace only the decision/provisioning block rejected because
          # the remote already carried the newer approval-error wording.
          service_path = 'src/modules/projects/projects.service.ts'
          service = Path(service_path).read_text()
          hs = file_hunks(service_path)
          decision_hunk = next(h for h in hs if any('let finalStatus = dto.finalStatus;' in x for x in h))
          desired = [x[1:] for x in decision_hunk if not x.startswith('-')]
          a = next(i for i,x in enumerate(desired) if 'let finalStatus = dto.finalStatus;' in x)
          desired = desired[a:]
          replacement = '\n'.join(desired).rstrip() + '\n\n'
          start = service.index('    let finalStatus = dto.finalStatus;')
          end = service.index('    const updated = await this.projectsRepo.updateById', start)
          service = service[:start] + replacement + service[end:]
          Path(service_path).write_text(service)

          # Spec: replace the old ROI provisioning/repair/backfill suites with the
          # creator-signed KEIBO provisioning suite from the stabilization patch.
          spec_path = 'src/modules/projects/projects.service.spec.ts'
          spec = Path(spec_path).read_text()
          hs = file_hunks(spec_path)
          big = next(h for h in hs if any("describe('Creator-signed KEIBO provisioning'" in x for x in h))
          desired = [x[1:] for x in big if not x.startswith('-')]
          start_idx = next(i for i,x in enumerate(desired) if '// Suite: ROI approval provisioning' in x)
          try:
              end_idx = next(i for i,x in enumerate(desired) if "describe('Public project query regressions'" in x)
          except StopIteration:
              end_idx = len(desired)
          replacement = '\n'.join(desired[start_idx:end_idx]).rstrip() + '\n\n'
          start = spec.index('// Suite: ROI approval provisioning')
          end = spec.index("describe('Public project query regressions'", start)
          spec = spec[:start] + replacement + spec[end:]
          Path(spec_path).write_text(spec)
          PY
          rm -rf .keibo-stabilization .github/workflows/reconcile-keibo-stabilization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconcile creator-signed ROI provisioning"
          git push origin HEAD:keibo/full-uat
