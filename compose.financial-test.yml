services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keibo_financial_test
      POSTGRES_USER: keibo_test
      POSTGRES_PASSWORD: keibo_test_only
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keibo_test -d keibo_financial_test']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
